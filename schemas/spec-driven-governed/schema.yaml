name: spec-driven-governed
version: 1
description: >-
  Governed Specbase workflow (opt-in) - permanent truth planes (shipped
  defaults behavior, architecture, ops, code-quality, design-system, agents)
  with every governed spec paired
  to a machine-validated enforcement contract. proposal -> specs -> design ->
  enforcement -> tasks. Projects may add, remove, or replace planes in
  specbase/config.yaml.
specModel:
  kind: governed
  version: 1
  # One offer-able plane list. `specbase init` presents these as a multi-select
  # (with a select-all toggle); each record's `defaultSelected` sets its initial
  # checkbox and, for a project that declares no plane override, forms the
  # resolved default set. Selecting zero planes keeps the project on the legacy
  # flat model; selecting one or more makes it governed. Projects may add,
  # remove, or replace planes in specbase/config.yaml (`specModel.planes+:` to
  # append, `specModel.planes:` to replace).
  planes:
    - id: behavior
      purpose: "User/client-visible outcomes that must remain true"
      enforcementFlavor: "tests / property tests"
      reviewLens: behavioural
      defaultSelected: true
    - id: architecture
      purpose: "Package responsibilities, boundaries, and structural invariants"
      enforcementFlavor: "lint / static-analysis / conformance"
      reviewLens: architectural
      defaultSelected: true
    - id: ops
      purpose: "What we use and how it runs: packages, dev env, IaC, deployment"
      enforcementFlavor: "lockfile audit / plan validate / drift detect"
      reviewLens: ops
      defaultSelected: true
    - id: code-quality
      purpose: "What good code looks like: smells, qualities, and rules"
      enforcementFlavor: "smell-lint + review"
      reviewLens: code-quality
      defaultSelected: true
    - id: design-system
      purpose: >-
        The product's expressed identity: visual design tokens (color, type,
        spacing, radius, motion), design principles, and the voice/tone of
        user-facing copy. Governs HOW outcomes are presented, orthogonal to
        behavior (WHAT they do). Token truths DESCRIBE the token artifact
        (tailwind.config / tokens.json), which stays the runtime source of
        truth, and bind lint/contrast/a11y checks against it; principle and
        voice truths bind the design review lens for the judgment a linter
        cannot make.
      enforcementFlavor: "token-lint / contrast + a11y checks + design review"
      reviewLens: design
      defaultSelected: false
    - id: agents
      purpose: >-
        The repo's own agentic instruments: review panel, repo-specific skills,
        subagents, and hooks it builds. Members are instruments the repo owns,
        NOT behavioral guardrails on agents (those ride on the plane whose
        subject they constrain). Each spec DESCRIBES an agent-operational
        artifact (config.yaml, DEFAULT_LENSES, a SKILL.md, a hook) and its
        enforcement binds a conformance/drift check to that artifact.
      enforcementFlavor: "instrument conforms to its spec (config / lens / frontmatter / hook checks)"
      defaultSelected: false
  enforcement:
    types:
      - { id: test, purpose: "Executable tests run by the project native test harness.", strength: automated, sourceKind: file }
      - { id: lint, purpose: "Static lint rules run by the project native lint harness.", strength: automated, sourceKind: file }
      - { id: static-analysis, purpose: "Deterministic structural analysis run by project tooling.", strength: automated, sourceKind: file }
      - { id: command, purpose: "A project-owned executable conformance source.", strength: automated, sourceKind: file }
      - { id: review, purpose: "Judgment performed through a configured review lens.", strength: review, sourceKind: lens }
      - { id: manual, purpose: "A project-owned manual verification procedure.", strength: manual, sourceKind: file }
  pairedEnforcement: true
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the governed change
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this governed change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. Why now?
      - **What Changes**: Bullet list of changes. Mark breaking changes with **BREAKING**.
      - **Planes**: Governed specs live in permanent truth planes. Classify every
        spec this change touches by the plane whose purpose fits it; the shipped
        defaults are:
        - **Behavioral truth** (`specs/behavior/<locator>/`): user- or client-visible
          capabilities that must remain true now.
        - **Architectural truth** (`specs/architecture/<locator>/`): package
          responsibilities, dependency invariants, and cross-cutting structural
          policies that must remain true now.
        - **Ops** (`specs/ops/<locator>/`): what the project uses and how it runs —
          packages, dev env, IaC, deployment.
        - **Code-quality** (`specs/code-quality/<locator>/`): smells, qualities, and
          rules about what good code looks like.
        - **Design-system** (`specs/design-system/<locator>/`): the product's
          expressed identity — design tokens, principles, and voice.
        - **Agents** (`specs/agents/<locator>/`): the repo's own agentic
          instruments — review panel, repo-specific skills, subagents, hooks.
        A project may declare additional planes in `specbase/config.yaml` (append
        via `specModel.planes+:` or replace via `specModel.planes:`); a single
        initiative may touch several planes. When it does, list a separate durable
        truth (and later, delta) for each plane rather than mixing them in one spec.
      - **Spec pairs**: For each plane target, name the stable project-wide spec ID
        (dot-separated kebab, e.g. `behavior.session-loop`, `architecture.domain`)
        and note whether it is new or an existing governed pair being modified.
        Every governed spec is paired with an `enforcement.yaml`, so each listed spec
        implies a paired enforcement contract.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Keep it concise. Focus on the "why" - historical rationale for this transition
      stays in the proposal and design and is preserved in the dated archive, NOT in
      the permanent architectural spec (which states only what must be true now).

      This is the foundation - specs, design, enforcement, and tasks build on it.
    requires: []

  - id: specs
    generates: "specs/**/spec.md"
    description: Governed specification deltas, one paired spec per plane target
    template: spec.md
    instruction: |
      Create governed specification delta files that define WHAT must remain true.

      Placement (derive concrete paths from CLI `status`/`instructions` output, do
      NOT hardcode a flat layout):
      - One spec delta per plane target listed in the proposal, under
        `specs/<plane>/<locator>/spec.md` where `<plane>` is one of the resolved
        plane set (shipped defaults: `behavior`, `architecture`, `ops`,
        `code-quality`, `design-system`, `agents`).
      The plane comes from the containing directory, never from metadata.

      Governed frontmatter and stable identity (immutable human-readable slugs;
      titles and locators stay mutable presentation):
      - Each spec begins with minimal frontmatter declaring the project-unique
        spec `id` (dot-separated kebab):
        ```
        ---
        id: architecture.domain
        ---
        ```
      - Each requirement and scenario declares a pair-local `**ID:**` slug on the
        line immediately below its heading:
        ```
        ### Requirement: Domain determinism
        **ID:** `domain-determinism`
        The domain MUST obtain time and randomness through injected ports.

        #### Scenario: Ambient time is rejected
        **ID:** `ambient-time-rejected`
        - **WHEN** a domain module reads ambient time
        - **THEN** architectural enforcement reports the violation
        ```
      - Requirement/scenario/binding IDs are unique only WITHIN their pair. The
        spec `id` is the only project-unique governed identity. When a spec moves
        to a new locator without changing meaning, keep its stable spec `id`.

      Delta operations (use `##` headers), same grammar as the legacy flat model:
      - **ADDED Requirements**, **MODIFIED Requirements** (full updated content),
        **REMOVED Requirements** (with **Reason**/**Migration**),
        **RENAMED Requirements** (FROM:/TO:).
      - Every requirement uses SHALL/MUST for normative claims and has at least one
        scenario. Scenarios use exactly four `####` hashes.

      See `behavioral-spec.md` and `architectural-spec.md` in this schema's templates
      for concrete per-plane examples. Every SHALL/MUST requirement here must be
      paired with at least one enforcement binding in the next artifact.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design and transition rationale for the governed change
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change and WHY
      this transition was chosen.

      Include design when any apply: cross-cutting change, new architectural pattern,
      new dependency, significant data-model change, or enforcement-mechanism choices
      that need reasoning before coding.

      Sections:
      - **Context**: Background, current state, constraints.
      - **Goals / Non-Goals**.
      - **Decisions**: Key technical choices with rationale (why X over Y?),
        including the source contract for each planned binding: assertions or observations,
        harness/environment, failure signal, and known boundary.
      - **Risks / Trade-offs**: [Risk] -> Mitigation.
      - **Migration Plan** and **Open Questions** as needed.

      Transitional rationale ("why we chose this approach for THIS change") is design
      or proposal content and lives in the dated archive - it is NOT current
      architectural truth. Keep the permanent architectural spec limited to what must
      remain true now; keep the story of the change here.
    requires:
      - proposal

  - id: enforcement
    generates: "specs/**/enforcement.yaml"
    description: Compact paired binding indexes from requirements to evidence sources
    template: enforcement.yaml
    instruction: |
      Create one `enforcement.yaml` beside each governed `spec.md`. The sibling
      spec and directory establish pair identity. The document contains a
      `bindings` map whose key is the stable binding ID and whose value contains
      exactly `type`, `covers`, and `source`.

      Choose `type` from the resolved project enforcement roster shown by
      status/instructions. `covers` names one or more requirement IDs only;
      scenarios inherit from their requirement. `source` is a project-relative
      file (optional `#selector`) for file-backed types or a configured lens ID
      for lens-backed types. Source implementation and execution details live in
      design.md, tasks.md, and the source itself, never in this index.

      A change delta upserts binding map keys. Retire current keys with a
      top-level `remove: [binding-id]`. Archive writes compact YAML and removes a
      legacy Markdown member only after coherent promotion succeeds.
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation checklist covering code AND its paired evidence
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **Follow the template exactly.** Apply parses `- [ ]` checkboxes to track
      progress. Group tasks under `## N.` headings; each task is `- [ ] N.M ...`.

      For a governed change, tasks must cover BOTH sides of every pair:
      - Implement the behavioral or architectural change itself.
      - Implement or update every planned source, link it from `enforcement.yaml`,
        execute it through its native harness, and record the result.
      - Include cleanup tasks for any enforcement target retired by a removed
        requirement, scenario, or binding - but only after checking that no
        surviving binding still shares that target.

      Order tasks by dependency. Each task should be verifiable.
    requires:
      - specs
      - design
      - enforcement

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, then work through pending tasks, implementing both the
    change and its paired enforcement evidence.

    Governed apply rules:
    - Implement each planned source, link it in `enforcement.yaml`, and execute it through its native harness.
    - Do NOT mark a governed spec's related work complete while any mandatory
      binding source remains stale, hanging, broken, unresolved, or unexecuted.
    - Before deleting a retired test, rule, or fixture, confirm no surviving
      binding still references it; never auto-delete a shared target.

    Pause if you hit blockers or need clarification.
