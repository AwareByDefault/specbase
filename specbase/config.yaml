schema: spec-driven-governed

# Spec planes governing this project — the authoritative source of
# truth. Add a record to gain a plane, remove one to drop it, empty
# the list to go flat.
specModel:
  planes:
    - id: behavior
      purpose: User/client-visible outcomes that must remain true
      enforcementFlavor: tests / property tests
      reviewLens: behavioural
    - id: architecture
      purpose: Package responsibilities, boundaries, and structural invariants
      enforcementFlavor: lint / static-analysis / conformance
      reviewLens: architectural
    - id: ops
      purpose: "What we use and how it runs: packages, dev env, IaC, deployment"
      enforcementFlavor: lockfile audit / plan validate / drift detect
      reviewLens: ops
    - id: code-quality
      purpose: "What good code looks like: smells, qualities, and rules"
      enforcementFlavor: smell-lint + review
      reviewLens: code-quality
    - id: design-system
      purpose: "The product's expressed identity: visual design tokens (color, type,
        spacing, radius, motion), design principles, and the voice/tone of
        user-facing copy. Governs HOW outcomes are presented, orthogonal to
        behavior (WHAT they do). Token truths DESCRIBE the token artifact
        (tailwind.config / tokens.json), which stays the runtime source of
        truth, and bind lint/contrast/a11y checks against it; principle and
        voice truths bind the design review lens for the judgment a linter
        cannot make."
      enforcementFlavor: token-lint / contrast + a11y checks + design review
      reviewLens: design
    - id: agents
      purpose: "The repo's own agentic instruments: review panel, repo-specific
        skills, subagents, and hooks it builds. Members are instruments the repo
        owns, NOT behavioral guardrails on agents (those ride on the plane whose
        subject they constrain). Each spec DESCRIBES an agent-operational
        artifact (config.yaml, DEFAULT_LENSES, a SKILL.md, a hook) and its
        enforcement binds a conformance/drift check to that artifact."
      enforcementFlavor: instrument conforms to its spec (config / lens / frontmatter
        / hook checks)

# Project context
# This is shown to AI when creating artifacts.
# Migrated verbatim from openspec-old/config.yaml (design D6).
context: |
  Tech stack: TypeScript, Node.js (≥20.19.0), ESM modules
  Package manager: pnpm
  CLI framework: Commander.js

  Product language:
  - Write OpenSpec proposals and specs in user-facing product behavior language
  - Requirements should describe the experience, observable behavior, and product contract
  - Avoid implementation-negative SHALL statements when a positive user outcome can express the same rule
  - Put internal mechanisms in design.md or tasks.md unless the mechanism is itself part of the user-facing contract

  Cross-platform requirements:
  - This tool runs on macOS, Linux, AND Windows
  - Always use path.join() or path.resolve() for file paths - never hardcode slashes
  - Never assume forward-slash path separators
  - Tests must use path.join() for expected path values, not hardcoded strings
  - Consider case sensitivity differences in file systems

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
